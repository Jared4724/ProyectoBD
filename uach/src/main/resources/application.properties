spring.application.name=uach

# ===============================
# Configuración Base de Datos Oracle
# ===============================
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/xepdb1
spring.datasource.username=${ORACLE_DB_USER:system}
spring.datasource.password=${ORACLE_DB_PASSWORD:admin}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===============================
# Configuración JPA e Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Estrategias de nomenclatura (camelCase a snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ===============================
# Configuración Thymeleaf
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
