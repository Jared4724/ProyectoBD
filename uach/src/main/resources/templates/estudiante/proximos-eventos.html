<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Próximos Eventos')}">
    <title>Próximos Eventos</title>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->
    <nav th:replace="~{layout :: navbar}"></nav>

    <!-- Sidebar -->
    <aside th:replace="~{layout :: sidebar-estudiante('proximos-eventos')}"></aside>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0">Próximos Eventos</h1>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card card-primary card-outline">
                            <div class="card-header">
                                <h3 class="card-title">Cartelera de Actividades</h3>
                            </div>
                            
                            <div class="card-body p-3 border-bottom bg-light">
                                <form th:action="@{/estudiante/proximos-eventos}" method="get" class="row">
                                    <input type="hidden" name="filter" value="true">
                                    <div class="col-md-6 mb-2">
                                        <label for="mes"><i class="fas fa-calendar-alt"></i> Mes</label>
                                        <select class="form-control" name="mes" id="mes" onchange="this.form.submit()">
                                            <option value="">Todos los meses</option>
                                            <option value="1" th:selected="${mesSeleccionado == 1}">Enero</option>
                                            <option value="2" th:selected="${mesSeleccionado == 2}">Febrero</option>
                                            <option value="3" th:selected="${mesSeleccionado == 3}">Marzo</option>
                                            <option value="4" th:selected="${mesSeleccionado == 4}">Abril</option>
                                            <option value="5" th:selected="${mesSeleccionado == 5}">Mayo</option>
                                            <option value="6" th:selected="${mesSeleccionado == 6}">Junio</option>
                                            <option value="7" th:selected="${mesSeleccionado == 7}">Julio</option>
                                            <option value="8" th:selected="${mesSeleccionado == 8}">Agosto</option>
                                            <option value="9" th:selected="${mesSeleccionado == 9}">Septiembre</option>
                                            <option value="10" th:selected="${mesSeleccionado == 10}">Octubre</option>
                                            <option value="11" th:selected="${mesSeleccionado == 11}">Noviembre</option>
                                            <option value="12" th:selected="${mesSeleccionado == 12}">Diciembre</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-2">
                                        <label for="idCategoria"><i class="fas fa-tags"></i> Categoría</label>
                                        <select class="form-control" name="idCategoria" id="idCategoria" onchange="this.form.submit()">
                                            <option value="">Todas las categorías</option>
                                            <option th:each="cat : ${categorias}" 
                                                    th:value="${cat.idCategoria}" 
                                                    th:text="${cat.nombreCategoria}"
                                                    th:selected="${categoriaSeleccionada == cat.idCategoria}">
                                            </option>
                                        </select>
                                    </div>
                                </form>
                            </div>
                            
                            <div class="card-body table-responsive p-0">
                                <table class="table table-hover text-nowrap">
                                    <thead>
                                        <tr>
                                            <th>Nombre</th>
                                            <th>Tipo</th>
                                            <th>Fecha</th>
                                            <th>Ubicación</th>
                                            <th>Puntos</th>
                                            <th>Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="evento : ${eventos}">
                                            <td th:text="${evento.nombreEvento}">Feria de Ciencias</td>
                                            <td th:text="${evento.categoria != null ? evento.categoria.nombreCategoria : 'N/A'}">Científico</td>
                                            <td th:text="${#temporals.format(evento.fecha, 'dd-MMM-yyyy HH:mm')}">25-May-2026</td>
                                            <td th:text="${evento.ubicacion}">Facultad de Ingeniería</td>
                                            <td th:text="${evento.puntos}">2</td>
                                            <td><button class="btn btn-sm btn-primary">Inscribirme</button></td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(eventos)}">
                                            <td colspan="6" class="text-center">No hay eventos próximos disponibles.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer th:replace="~{layout :: footer}"></footer>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
