<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Sistema de Carnet Cultural'">Carnet Cultural</title>
    <style>
        :root {
            --primary-color: #5b2c6f; /* Morado representativo UACH */
            --primary-hover: #4a235a;
            --background-color: #f4f6f9;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .main-content {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .footer {
            background-color: #1a202c;
            color: #e2e8f0;
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
            font-size: 0.875rem;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #4a5568;
            font-size: 0.875rem;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(91, 44, 111, 0.2);
        }
        .btn {
            display: inline-block;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            color: #fff;
            background-color: var(--primary-color);
            border: none;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <header th:fragment="header" class="header">
        <h1>Carnet Cultural UACH</h1>
        <nav>
            <a th:if="${session.usuarioId != null}" th:href="@{/logout}" class="btn" style="background-color: #e53e3e; padding: 0.5rem 1rem;">Cerrar Sesión</a>
        </nav>
    </header>

    <footer th:fragment="footer" class="footer">
        <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> Universidad Autónoma de Chihuahua. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
