<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Gestión de Eventos')}">
    <title>Gestión de Eventos</title>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->
    <nav th:replace="~{layout :: navbar}"></nav>

    <!-- Sidebar -->
    <aside th:replace="~{layout :: sidebar-empleado('eventos')}"></aside>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0">Eventos</h1>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main content -->
        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <!-- Card AdminLTE -->
                        <div class="card">
                            <div class="card-header d-flex align-items-center">
                                <h3 class="card-title">Gestión de Eventos</h3>
                                <!-- Botón verde alineado a la derecha -->
                                <a th:href="@{/empleado/eventos/nuevo}" class="btn btn-success ml-auto">
                                    <i class="fas fa-plus"></i> Crear Nuevo Evento
                                </a>
                            </div>
                            
                            <div class="card-body bg-light border-bottom">
                                <form th:action="@{/empleado/eventos}" method="get" class="row">
                                    <div class="col-md-6 mb-2">
                                        <label for="mes"><i class="far fa-calendar-alt"></i> Mes del Evento</label>
                                        <select class="form-control" name="mes" id="mes" onchange="this.form.submit()">
                                            <option value="" th:selected="${mesSeleccionado == null}">Todos los meses</option>
                                            <option value="1" th:selected="${mesSeleccionado == 1}">Enero</option>
                                            <option value="2" th:selected="${mesSeleccionado == 2}">Febrero</option>
                                            <option value="3" th:selected="${mesSeleccionado == 3}">Marzo</option>
                                            <option value="4" th:selected="${mesSeleccionado == 4}">Abril</option>
                                            <option value="5" th:selected="${mesSeleccionado == 5}">Mayo</option>
                                            <option value="6" th:selected="${mesSeleccionado == 6}">Junio</option>
                                            <option value="7" th:selected="${mesSeleccionado == 7}">Julio</option>
                                            <option value="8" th:selected="${mesSeleccionado == 8}">Agosto</option>
                                            <option value="9" th:selected="${mesSeleccionado == 9}">Septiembre</option>
                                            <option value="10" th:selected="${mesSeleccionado == 10}">Octubre</option>
                                            <option value="11" th:selected="${mesSeleccionado == 11}">Noviembre</option>
                                            <option value="12" th:selected="${mesSeleccionado == 12}">Diciembre</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-2">
                                        <label for="idCategoria"><i class="fas fa-tags"></i> Categoría</label>
                                        <select class="form-control" name="idCategoria" id="idCategoria" onchange="this.form.submit()">
                                            <option value="">Todas las categorías</option>
                                            <option th:each="cat : ${categorias}" 
                                                    th:value="${cat.idCategoria}" 
                                                    th:text="${cat.nombreCategoria}"
                                                    th:selected="${categoriaSeleccionada == cat.idCategoria}">
                                            </option>
                                        </select>
                                    </div>
                                </form>
                            </div>
                            <!-- /.card-header -->
                            <div class="card-body table-responsive p-0">
                                <table class="table table-hover text-nowrap">
                                    <thead>
                                        <tr>
                                            <th>Nombre</th>
                                            <th>Fecha Evento</th>
                                            <th>Fecha Fin</th>
                                            <th>Ubicación</th>
                                            <th>Puntos</th>
                                            <th>Categoría</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="evento : ${eventos}">
                                            <td th:text="${evento.nombreEvento}"></td>
                                            <td th:text="${#temporals.format(evento.fechaInicio, 'dd/MM/yyyy HH:mm')}"></td>
                                            <td th:text="${evento.fechaFin != null ? #temporals.format(evento.fechaFin, 'dd/MM/yyyy HH:mm') : 'Permanente'}"></td>
                                            <td th:text="${evento.ubicacion}"></td>
                                            <td th:text="${evento.puntos}"></td>
                                            <td th:text="${evento.categoria.nombreCategoria}"></td>
                                            <td>
                                                <a th:href="@{/empleado/eventos/editar/{id}(id=${evento.idEvento})}" class="btn btn-sm btn-primary" title="Editar">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <a th:href="@{/empleado/eventos/eliminar/{id}(id=${evento.idEvento})}" class="btn btn-sm btn-danger" title="Eliminar" onclick="return confirm('¿Estás seguro de eliminar este evento?');">
                                                    <i class="fas fa-trash"></i>
                                                </a>
                                            </td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(eventos)}">
                                            <td colspan="7" class="text-center">No hay eventos registrados.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <!-- /.card-body -->
                        </div>
                        <!-- /.card -->
                    </div>
                </div>
            </div>
        </section>
        <!-- /.content -->
    </div>

    <!-- Footer -->
    <footer th:replace="~{layout :: footer}"></footer>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
