<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Panel Empleado')}">
    <title>Panel Empleado</title>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->
    <nav th:replace="~{layout :: navbar}"></nav>

    <!-- Sidebar -->
    <aside th:replace="~{layout :: sidebar-empleado('dashboard')}"></aside>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0">Panel Principal - Empleado</h1>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card card-primary card-outline">
                            <div class="card-header">
                                <h3 class="card-title">Bienvenido al Panel de Administración</h3>
                            </div>
                            <div class="card-body">
                                <p style="font-size: 1.2rem; margin-top: 1rem;">Hola, <span th:text="${usuarioNombre}">Empleado</span>.</p>
                                <p>Aquí podrás gestionar los eventos culturales, validaciones y otras actividades administrativas del Carnet Cultural.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer th:replace="~{layout :: footer}"></footer>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
