<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout :: head('Iniciar Sesión')}">
</head>
<body>
    
    <header th:replace="~{layout :: header}"></header>

    <main class="main-content">
        <div class="card">
            <h2 style="text-align: center; margin-top: 0; margin-bottom: 1.5rem; color: #2d3748;">Bienvenido</h2>
            <!-- El formulario enviará a un endpoint /login cuando se implemente Spring Security o el controlador manual -->
            <form action="#" th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" class="form-control" placeholder="usuario@uach.mx" required>
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Ingresar</button>
            </form>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
