<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{layout :: head('Inicio')}">
    <title>Inicio</title>
</head>

<body>

    <header th:replace="~{layout :: header}"></header>

    <main class="main-content">
        <div class="card" style="text-align: center;">
            <h2 style="margin-top: 0; color: var(--primary-color);">Bienvenido al Sistema de Carnet Cultural</h2>
            <p style="color: #4a5568; margin-bottom: 2rem; line-height: 1.6;">
                La plataforma oficial de la Universidad Autónoma de Chihuahua para gestionar y registrar tu
                participación en eventos culturales.
            </p>

            <a th:href="@{/login}" class="btn"
                style="text-decoration: none; display: inline-block; width: auto; min-width: 200px;">
                Iniciar Sesión
            </a>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>

</body>

</html>
